[project]
name = "research-assistant"
version = "0.1.0"
description = "A research assistant that plans, searches, reads, and writes a short brief — built multiple ways to compare agentic architectures."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "tavily-python>=0.5",
    "pydantic>=2",
    "pydantic-settings>=2",
    "typer>=0.15",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
    "ruff>=0.8",
    "httpx>=0.27",
]
notebook = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "tokenizers>=0.19",
    "transformers>=4.40",
]
graphrag = [
    "neo4j>=5",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
research-assistant = "research_assistant.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]

[tool.pytest.ini_options]
markers = [
    "live: tests that make real API calls (excluded by default)",
]
addopts = "-m 'not live'"
